apiVersion: v1
kind: ConfigMap
metadata:
  name: healer-config
  namespace: self-healing
data:
  HEALER_ALLOWED_NAMESPACES: "demo"
  # !!! Demo cluster: actually act. For ANY real cluster set this to "true" first and read the
  # incident reports for a few days before enabling actions.
  HEALER_DRY_RUN: "false"
  HEALER_PROMETHEUS_URL: "http://kps-prometheus.monitoring.svc:9090"
  HEALER_LOKI_URL: "http://loki.monitoring.svc:3100"
  HEALER_MODEL: "claude-sonnet-5-5"
  HEALER_COOLDOWN_SECONDS: "300"
  HEALER_MAX_ACTIONS_PER_HOUR: "3"
  HEALER_MAX_REPLICAS: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer-agent
  namespace: self-healing
  labels: { app: healer-agent }
spec:
  replicas: 1          # state (cooldowns, in-flight) is in memory; do not scale out without leader election
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: healer-agent }
  template:
    metadata:
      labels: { app: healer-agent }
    spec:
      serviceAccountName: healer-agent
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: agent
          image: healer-agent:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: healer-config }
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: healer-secrets, key: ANTHROPIC_API_KEY, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: incidents, mountPath: /data/incidents }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: incidents, emptyDir: {} }      # swap for a PVC to keep reports across restarts
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: healer-agent
  namespace: self-healing
  labels: { app: healer-agent }
spec:
  selector: { app: healer-agent }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: healer-agent
  namespace: self-healing
spec:
  selector:
    matchLabels: { app: healer-agent }
  endpoints:
    - { port: http, path: /metrics/, interval: 15s }
