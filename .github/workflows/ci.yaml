name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/requirements-dev.txt }
      - run: pip install -r agent/requirements-dev.txt
      - run: cd agent && python -m pytest -q
      - name: shell + yaml sanity
        run: |
          for f in chaos/*.sh scripts/*.sh; do bash -n "$f"; done
          pip install pyyaml && python -c "import yaml,glob;[list(yaml.safe_load_all(open(f))) for f in glob.glob('**/*.yaml',recursive=True)]"
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t healer-agent:ci agent
      - run: docker build -t demo-app:ci demo-app
